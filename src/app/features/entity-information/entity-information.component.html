<div class="p-2 pt-6 bg-white">
  <form [formGroup]="editForm" class="">
    <div class="text-md w-full h-10 flex flex-row items-center bg-gray-200 p-2 hover:cursor-pointer" (click)="isOpenBusiness = !isOpenBusiness">
      <img src="/assets/images/FoldableArrow.png" alt="Arrow" 
        class="inline-block w-auto h-4"
        [class.rotate-90]="isOpenBusiness"/>
      <span class="ml-1">Business Legal Information</span>
    </div>
    <div
      class="transition-all duration-300 overflow-hidden"
      [style.maxHeight]="isOpenBusiness ? '200px' : '0px'"
    >
      <div class="text-sm grid grid-cols-2 px-8 py-6 gap-2">
        <div class="grid grid-cols-[max-content_1fr] gap-2 border border-green-400">
          <label class="mr-2"> Firm Type:<span class="text-red-600">*</span></label>
          <div class="flex w-full">
            <label class="w-1/2 flex items-center cursor-pointer">
              <label class="relative flex items-center cursor-pointer mx-1">
                <input type="radio" name="firmtype" class="peer h-2 w-2 cursor-pointer appearance-none rounded-full border border-black bg-white">
                <span class="absolute bg-slate-800 w-1 h-1 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
              </label>
              <span class="ml-1">Private</span>
            </label>
            <label class="w-1/2 flex items-center cursor-pointer">
              <div class="relative flex items-center cursor-pointer mx-1">
                <input type="radio" name="firmtype" class="peer h-2 w-2 cursor-pointer appearance-none rounded-full border border-black bg-white">
                <span class="absolute bg-slate-800 w-1 h-1 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
              </div>
              <span class="ml-1">Public</span>
            </label>
          </div>
          <label class="mr-2">Risk Currency:</label>
          <div class="relative">
            <select formControlName="riskCurrency" class="hover:cursor-pointer bg-white border-2 border-gray-200 rounded-md w-50" placeholder="">
                <option value=""></option>
                @for (op of currencyOptions; track op.code){
                    <option [value]="op.code" class="px-1 whitespace-pre-wrap">
                        {{op.code}} {{op.label}}
                    </option>
                }
            </select>
          </div>
          <label class="mr-2">Primary Stock Code:</label>
          <input formControlName="primaryStockCode" type="text" class="border-2 border-gray-200 rounded-md max-w-50"/>

        </div>
        <div class="grid grid-cols-[max-content_1fr] gap-2 border border-green-400">
          <label class =""> Country of Risk:<span class="text-red-500">*</span></label>
          <div class="relative">
            <select formControlName="countryOfRisk" class="hover:cursor-pointer bg-white border-2 border-gray-200 rounded-md w-70 truncate" placeholder="">
                <option value="" class="overflow-hidden max-w-50"></option>
                @for (op of countryOptions; track op.code){
                    <option [value]="op.code" class="px-1">
                        {{op.label}}
                    </option>
                }
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="text-md w-full h-10 flex flex-row items-center bg-gray-200 p-2 hover:cursor-pointer" (click)="isOpenIndustry = !isOpenIndustry">
      <img src="/assets/images/FoldableArrow.png" alt="Arrow" 
        class="inline-block w-auto h-4"
        [class.rotate-90]="isOpenIndustry"/>
      <span class="ml-1">Industry Information</span>
    </div>
  </form>
</div>
