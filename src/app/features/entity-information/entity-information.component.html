<div class="p-2 pt-6 bg-white h-full">
  <form [formGroup]="editForm" class="">
    <div class="text-md w-full h-10 flex flex-row items-center bg-gray-200 p-2 hover:cursor-pointer" (click)="isOpenBusiness = !isOpenBusiness">
      <img src="/assets/images/FoldableArrow.png" alt="Arrow" 
        class="inline-block w-auto h-4"
        [class.rotate-90]="isOpenBusiness"/>
      <span class="ml-1">Business Legal Information</span>
    </div>
    <div
      class="transition-all duration-300 overflow-hidden"
      [style.maxHeight]="isOpenBusiness ? '200px' : '0px'"
    >
      <div class="text-sm grid grid-cols-2 px-8 py-6 gap-2">
        <div class="grid grid-cols-[max-content_1fr] gap-2 ">
          <label class="mr-2"> Firm Type:<span class="text-red-600">*</span></label>
          <div class="flex w-full">
            <label class=" flex items-center cursor-pointer mr-4">
              <label class="relative flex items-center cursor-pointer mx-1">
                <input type="radio" name="firmtype" class="peer h-2 w-2 cursor-pointer appearance-none rounded-full border border-black bg-white">
                <span class="absolute bg-slate-800 w-1 h-1 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
              </label>
              <span class="ml-1">Private</span>
            </label>
            <label class=" flex items-center cursor-pointer">
              <div class="relative flex items-center cursor-pointer mx-1">
                <input type="radio" name="firmtype" class="peer h-2 w-2 cursor-pointer appearance-none rounded-full border border-black bg-white">
                <span class="absolute bg-slate-800 w-1 h-1 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-100 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
              </div>
              <span class="ml-1">Public</span>
            </label>
          </div>
          <label class="mr-2">Risk Currency:</label>
          <div class="relative">
            <select formControlName="riskCurrency" class="hover:cursor-pointer bg-white border-2 border-gray-200 rounded-md w-50" placeholder="">
                <option value=""></option>
                @for (op of currencyOptions; track op.code){
                    <option [value]="op.code" class="px-1 whitespace-pre-wrap">
                        {{op.code}} {{op.label}}
                    </option>
                }
            </select>
          </div>
          <label class="mr-2">Primary Stock Code:</label>
          <input formControlName="primaryStockCode" type="text" class="border-2 border-gray-200 rounded-md w-50"/>

        </div>
        <div class="grid grid-cols-[max-content_1fr] gap-2 content-start ">
          <label class ="me-2"> Country of Risk:<span class="text-red-500">*</span></label>
          <div class="relative">
            <select formControlName="countryOfRisk" class="hover:cursor-pointer bg-white border-2 border-gray-200 rounded-md w-50 truncate" placeholder="">
                <option value="" class="overflow-hidden max-w-50"></option>
                @for (op of countryOptions; track op.code){
                    <option [value]="op.code" class="px-1">
                        {{op.label}}
                    </option>
                }
            </select>
          </div>
          <label class="mr-2">Listing Date:</label>
          <input formControlName="primaryStockCode" type="text" class="border-2 border-gray-200 rounded-md w-50"/>
        </div>
      </div>
    </div>
    <div class="text-md w-full h-10 flex flex-row items-center bg-gray-200 p-2 hover:cursor-pointer" (click)="isOpenIndustry = !isOpenIndustry">
      <img src="/assets/images/FoldableArrow.png" alt="Arrow" 
        class="inline-block w-auto h-4"
        [class.rotate-90]="isOpenIndustry"/>
      <span class="ml-1">Industry Information</span>
    </div>
    <div
      class="transition-all duration-300 overflow-hidden px-4"
      [style.maxHeight]="isOpenIndustry ? '200px' : '0px'"
    >
      <div class="text-sm flex px-8 py-6 gap-2">
        <label class="mr-2">Industry Classification:</label>
        <div class="relative">
          <select formControlName="indClass" class="hover:cursor-pointer bg-white border-2 border-gray-200 rounded-md w-50 truncate" placeholder="">
              <option value="ISIC V4" class="overflow-hidden max-w-50 hidden selected">ISIC V4</option>
              @for (op of indClassOptions; track op.code){
                  @if (op.code !== 'ISIC V4'){
                  <option [value]="op.code" class="px-1">
                      {{op.label}}
                  </option>
                  }
              }
          </select>
        </div>
      </div>
      <table class="border-collapse w-full table-auto">
        <thead class="bg-gray-300">
            <tr>
                <th class="w-10"><h2 class="flex text-green-400 text-md font-bold p-1 align-middle justify-center"
                    (click)="createIndustryRow()">
                    ✚</h2></th>
                <th class="text-xs text-semibold text-left align-top py-2 ">
                  Industry Code <span class="text-red-500">*</span>
                </th>
                <th class="text-xs text-semibold text-left align-top py-2 ">Percentage (%) <span class="text-red-500">*</span></th>
                <th class="text-xs text-semibold text-left align-top py-2 ">Primary?</th>
            </tr>
        </thead>

        <tbody>
            @for(row of rows; track row.id){
                <tr class="border-b border-gray-300">
                    <td><h2 class="flex text-red-500 font-bold align-middle justify-center">×</h2></td>
                    <td><h2 class="flex text-xs align-middle justify-left">{{row.code +" - "+row.description}}</h2></td>
                    <td><h2 class="flex text-xs align-middle justify-left">{{row.percentage}}</h2></td>
                    <td><h2 class="flex text-xs align-middle justify-left">{{row.primary ? 'Yes':'No'}}</h2></td>
                </tr>
            }
        </tbody>
    </table>
    </div>
  </form>
</div>
