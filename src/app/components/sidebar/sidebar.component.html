<aside class="w-64 bg-purple-800 overflow-y-auto fixed left-0 top-18 bottom-0">
  <nav class="pt-0 space-y-0">
    @for (item of navItems; track item.label) {
      <div>
        <!-- Main menu item -->
        <div
          class="p-4 text-white flex items-center justify-between cursor-pointer transition-colors duration-300 hover:bg-purple-700"
          [class.bg-purple-600]="isActive(item)"
          [class.font-semibold]="isActive(item)"
          (click)="navigateTo(item, $event)">
          <div class="flex items-center gap-3">
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            <span>{{ item.label }}</span>
          </div>
          @if (item.children) {
            <i [class]="item.expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
               class="text-sm transition-transform duration-200"></i>
          }
        </div>

        <!-- Submenu items -->
        @if (item.children && item.expanded) {
          <div class="bg-purple-900">
            @for (child of item.children; track child.label) {
              <div
                class="pl-12 pr-4 py-3 text-white text-sm cursor-pointer transition-colors duration-300 hover:bg-purple-700"
                [class.bg-purple-600]="isActive(child)"
                [class.font-semibold]="isActive(child)"
                (click)="navigateTo(child, $event)">
                {{ child.label }}
              </div>
            }
          </div>
        }
      </div>
    }
  </nav>
</aside>
